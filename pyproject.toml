[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tlecorrect"
version = "1.0.0"
description = "Estimate a corrected TLE from recorded I/Q using Doppler"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "sgp4>=2.23",
    "pydantic>=2.6",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
gui = ["PySide6>=6.6", "matplotlib>=3.8"]
dev = ["pytest>=7.4", "ruff>=0.4"]
pack = ["pyinstaller>=6.0"]

[project.scripts]
tlecorrect = "tlecorrect.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tlecorrect = ["data/*.npz", "data/*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
